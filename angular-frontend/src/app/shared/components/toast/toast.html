<div class="pointer-events-none fixed right-4 top-4 z-50 flex w-80 flex-col gap-2">
  <div *ngFor="let t of toasts"
       class="pointer-events-auto rounded px-4 py-3 text-white shadow-lg transition-all duration-300"
       [ngClass]="{
         'bg-green-600': t.type === 'success',
         'bg-red-600': t.type === 'error',
         'bg-blue-600': t.type === 'info',
         'bg-amber-600': t.type === 'warning'
       }">
    <div class="flex items-start justify-between gap-3">
      <p class="text-sm font-medium">{{ t.message }}</p>
      <button type="button" class="text-white/80 hover:text-white" (click)="dismiss(t.id)">×</button>
    </div>
  </div>
</div>
