<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto mt-12 max-w-md space-y-6 bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-3xl font-bold text-gray-900 text-center">Iniciar sesión</h1>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
      <input type="email" formControlName="email" 
             class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
      <input type="password" formControlName="password" 
             class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
    </div>

    <button [disabled]="loading || form.invalid" 
            class="w-full h-12 bg-blue-600 text-white py-2 px-4 rounded-md shadow-sm hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed font-medium">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>

    <p class="text-center text-sm text-gray-600">
      ¿No tienes cuenta? <a routerLink="/register" class="text-blue-600 hover:text-blue-700 font-medium">Crear una</a>
    </p>
    <a routerLink="/" class="block text-center text-sm text-gray-500 hover:text-gray-700">← Volver al inicio</a>
  </form>
</div>
