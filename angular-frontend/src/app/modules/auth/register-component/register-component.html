<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto max-w-md space-y-4 bg-white p-8 rounded shadow">
    <h1 class="text-2xl font-semibold text-center">Crear cuenta</h1>
    <div>
      <label class="block text-sm font-medium">Nombre</label>
      <input type="text" formControlName="nombre" class="mt-1 w-full rounded border px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium">Email</label>
      <input type="email" formControlName="email" class="mt-1 w-full rounded border px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium">Contraseña</label>
      <input type="password" formControlName="password" class="mt-1 w-full rounded border px-3 py-2" />
    </div>
    <button [disabled]="loading || form.invalid" class="w-full h-11 rounded bg-blue-600 text-white font-semibold">
      {{ loading ? 'Creando...' : 'Registrarme' }}
    </button>
    <p class="text-center text-sm mt-4">
      ¿Ya tienes cuenta? <a routerLink="/login" class="text-blue-600 font-medium">Inicia sesión</a>
    </p>
  </form>
</div>
