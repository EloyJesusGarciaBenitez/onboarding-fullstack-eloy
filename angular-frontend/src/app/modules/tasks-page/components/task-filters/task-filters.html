<form [formGroup]="form" class="bg-slate-50 p-4 rounded-lg flex flex-wrap gap-4 items-end mb-6">
  <div class="flex-1 min-w-[200px]">
    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Buscar tarea</label>
    <input type="text" formControlName="q" 
           class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" 
           placeholder="Ej: Comprar pan...">
  </div>

  <div class="w-48">
    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Estado</label>
    <select formControlName="estado" 
            class="w-full border border-slate-300 rounded px-3 py-2 bg-white outline-none">
      <option value="">Todos</option>
      <option value="pendiente">Pendiente</option>
      <option value="en progreso">En progreso</option>
      <option value="completada">Completada</option>
    </select>
  </div>

  <button type="button" (click)="limpiar()" 
          class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">
    Limpiar
  </button>
</form>
